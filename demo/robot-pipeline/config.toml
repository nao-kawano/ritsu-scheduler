# ==============================================================================
# Ritsu Scheduler Configuration - Robot Pipeline Demo (Multi-Language DAG)
# ==============================================================================

[server_config]
# UDP port bound by rt-server for Control Plane signaling
port = 10000
# Deterministic pipeline period in milliseconds (200 ms = 5 Hz)
cycle_time_ms = 200
# Interval (in cycles) for printing periodic scheduling statistics
stats_interval_cycle = 10
# Console log level filter ("error", "warn", "info", "debug", "trace")
log_level = "info"
# Directory where rt-server writes structured logs (imported by rt-vis)
log_file_dir = "./logs"
# File log level filter (keep "debug" to record full Gantt chart traces)
log_file_level = "debug"

# 1. Sensor acquisition (periodic cycle start)
# Simulates LiDAR point cloud scan and camera frame capture (8-12 ms).
[[client_configs]]
client_id = 10
start_cycle = 0
interval = 1
offset = 0
depends = []
display_name = "Sensor (C++)"
expected_duration_ms = 10

# 2. AI vision inference (parallel fork after sensor)
# Detects dynamic obstacles and classifies path clearance (55-85 ms).
[[client_configs]]
client_id = 20
start_cycle = 0
interval = 1
offset = 0
depends = [10]
display_name = "AI-Vision (Py)"
expected_duration_ms = 70

# 3. Odometry estimation (parallel fork after sensor)
# Integrates wheel encoders and IMU to track robot pose (18-23 ms).
[[client_configs]]
client_id = 30
start_cycle = 0
interval = 1
offset = 0
depends = [10]
display_name = "Odometry (C++)"
expected_duration_ms = 20

# 4. Motion planning (join barrier after AI and Odometry)
# Joins vision and odometry branches to compute velocity commands (35-45 ms).
[[client_configs]]
client_id = 40
start_cycle = 0
interval = 1
offset = 0
depends = [20, 30]
display_name = "Planner (Rust)"
expected_duration_ms = 40

# 5. Motor actuation (runs after planner)
# Commands wheel servos based on planned linear and angular velocities (18-22 ms).
[[client_configs]]
client_id = 50
start_cycle = 0
interval = 1
offset = 0
depends = [40]
display_name = "Motor (C++)"
expected_duration_ms = 20
